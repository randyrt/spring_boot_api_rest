services:
  mariadb:
    image: mariadb:10.11
    container_name: spring_mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root_password
      MARIADB_DATABASE: spring_db
      MARIADB_USER: spring_user
      MARIADB_PASSWORD: spring_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - spring_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: spring_phpmyadmin
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
    ports:
      - "8081:80"
    networks:
      - spring_network

volumes:
  mariadb_data:

networks:
  spring_network:
    driver: bridge
