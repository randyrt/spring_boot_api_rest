spring.application.name=demo
server.port=8080
server.servlet.context-path=/api

# Valeurs utilisées lorsque Spring Boot est lancé localement.
# Docker Compose surcharge ces propriétés avec les variables d'environnement.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/spring_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:spring_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:spring_password}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
